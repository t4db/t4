version: "3.8"

# Shared node definition — 5 DB nodes running t4.
x-node: &node
  build:
    context: ..                        # t4 repo root (Go source lives here)
    dockerfile: jepsen/node/Dockerfile
  cap_add: [NET_ADMIN, NET_RAW, SYS_PTRACE]
  networks: [jepsen]
  environment:
    # T4-scoped S3 credentials — picked up via T4_S3_* env vars.
    T4_S3_ACCESS_KEY_ID: "jepsen"
    T4_S3_SECRET_ACCESS_KEY: "jepsen123"
    T4_S3_REGION: "us-east-1"   # the S3 server ignores this but the SDK requires it
  ulimits:
    nofile: { soft: 65536, hard: 65536 }

services:
  # ── Control node ──────────────────────────────────────────────────────────
  control:
    build:
      context: control
      dockerfile: Dockerfile
    hostname: control
    networks: [jepsen]
    volumes:
      - ./:/jepsen              # mount jepsen project files (hot-reload)
      - lein-cache:/root/.lein  # cache downloaded deps between runs
    working_dir: /jepsen
    depends_on: [n1, n2, n3, n4, n5]
    stdin_open: true
    tty: true
    # Default: drop into a shell. Override with:
    #   docker compose run control lein run -- --nodes n1,n2,n3,n4,n5 ...
    command: ["/bin/bash"]

  # ── DB nodes ──────────────────────────────────────────────────────────────
  n1: { <<: *node, hostname: n1 }
  n2: { <<: *node, hostname: n2 }
  n3: { <<: *node, hostname: n3 }
  n4: { <<: *node, hostname: n4 }
  n5: { <<: *node, hostname: n5 }

  # ── S3 (object store, outside partition boundary) ─────────────────────────
  # RustFS, an S3-compatible server. MinIO's community images were withdrawn
  # from Docker Hub and quay.io.
  s3:
    image: rustfs/rustfs:1.0.0
    hostname: s3
    networks: [jepsen]
    environment:
      RUSTFS_ACCESS_KEY: jepsen
      RUSTFS_SECRET_KEY: jepsen123
    volumes: [s3-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the 'jepsen' bucket on first boot.
  s3-init:
    image: rustfs/rustfs:1.0.0
    networks: [jepsen]
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        code=$$(curl -s -o /dev/null -w %{http_code} --aws-sigv4 aws:amz:us-east-1:s3 --user jepsen:jepsen123 -X PUT http://s3:9000/jepsen) &&
        echo create bucket: $$code && [ $$code = 200 ] || [ $$code = 409 ]
      "

networks:
  jepsen:
    driver: bridge

volumes:
  s3-data:
  lein-cache:
