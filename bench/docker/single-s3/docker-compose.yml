# single-s3 — one T4 node (WAL sync-upload to S3) vs one etcd node.
#
# T4 uploads every WAL segment to S3 (RustFS) before ACKing writes
# (--wal-sync-upload=true), providing comparable remote durability to etcd's
# fsync-per-write model. Use this scenario for fair throughput/latency
# comparisons when durability is a requirement.
#
# Ports exposed on the host:
#   t4  → localhost:3379
#   etcd    → localhost:2379
#
# Images must be pre-built before running:
#   docker build -f bench/Dockerfile.t4 -t t4-bench .
#   docker build -f bench/Dockerfile        -t t4bench  .

services:

  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: bench
      RUSTFS_SECRET_KEY: bench123
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [bench]

  s3-init:
    image: rustfs/rustfs:1.0.0
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        code=$$(curl -s -o /dev/null -w %{http_code} --aws-sigv4 aws:amz:us-east-1:s3 --user bench:bench123 -X PUT http://s3:9000/bench) &&
        echo create bucket: $$code && [ $$code = 200 ] || [ $$code = 409 ]
      "
    networks: [bench]

  t4:
    image: t4-bench
    depends_on:
      s3-init:
        condition: service_completed_successfully
    command:
      - run
      - --listen=0.0.0.0:2379
      - --data-dir=/data
      - --metrics-addr=0.0.0.0:9090
      - --s3-bucket=bench
      - --s3-prefix=single
      - --s3-endpoint=http://s3:9000
      - --wal-sync-upload=true
      - --log-level=warn
    environment:
      T4_S3_ACCESS_KEY_ID: bench
      T4_S3_SECRET_ACCESS_KEY: bench123
      T4_S3_REGION: us-east-1
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    ports:
      - "3379:2379"
    volumes:
      - t4-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [bench]

  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.4
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
    ports:
      - "2379:2379"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [bench]

  bench:
    image: t4bench
    profiles: [bench]
    networks: [bench]

networks:
  bench:

volumes:
  t4-data:
  etcd-data:
  s3-data:
