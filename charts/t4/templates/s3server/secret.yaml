{{- if .Values.s3server.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t4.s3server.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "t4.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Root credentials for the built-in S3 server, under the env var names t4
  # reads.
  T4_S3_ACCESS_KEY_ID: {{ .Values.s3server.accessKey | quote }}
  T4_S3_SECRET_ACCESS_KEY: {{ .Values.s3server.secretKey | quote }}
{{- end }}
