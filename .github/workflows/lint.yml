name: Lint

on:
  push:
    branches:
      - main
      # Digit-anchored: a bare "release-*" also matches topic branches
      # named like release-checksums, and a PR from one then runs this
      # workflow twice, for the push and the pull request. A release
      # branch has to start with a version digit to match, as
      # release-1.1 does.
      - "release-[0-9]*"
  pull_request:
    branches: ["**"]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          only-new-issues: true
