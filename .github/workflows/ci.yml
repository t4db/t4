name: CI

on:
  push:
    branches:
      - main
      - "release-*"
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-generated:
    name: Check Generated Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Regenerate generated docs
        run: make docs-generate

      - name: Check generated docs are up to date
        run: git diff --exit-code -- docs/configuration.md website/src/content/docs/configuration.md

  modules-tidy:
    name: Check Modules Tidy
    runs-on: ubuntu-latest

    # The repository holds four modules, and tests/etcddiff replaces
    # github.com/t4db/t4 with ../.., so the root module's requirement list is
    # part of its build list: bumping a root dependency leaves its go.mod and
    # go.sum stale. `go test` then refuses to run at all, which surfaces as a
    # failure in whichever job happens to build that module rather than as the
    # missing tidy it is. Check every module here instead.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy every module
        run: |
          set -euo pipefail
          # Fed by process substitution rather than a pipe, so the loop body
          # runs in this shell and a failing tidy fails the step.
          while IFS= read -r -d '' mod; do
            dir="$(dirname "$mod")"
            echo "::group::go mod tidy $dir"
            (cd "$dir" && go mod tidy)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path '*/node_modules/*' -print0)

      - name: Check every module is tidy
        run: |
          if ! git diff --exit-code -- '*go.mod' '*go.sum'; then
            echo "::error::a go.mod or go.sum is not tidy; run 'go mod tidy' in the module shown above"
            exit 1
          fi

  test-unit:
    name: Test Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test (unit)
        shell: bash
        run: |
          go test -short -timeout ${{ matrix.os == 'windows-latest' && '15m' || '360s' }} -count=1 \
            . \
            ./cmd/t4 \
            ./etcd \
            ./etcd/auth \
            ./internal/... \
            ./pkg/object \
            ./tests/compat

  test-integration-linux:
    name: Test Integration (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test (integration)
        run: go test -short -timeout 360s -count=1 ./tests/integration

  test-apiserver-linux:
    name: Test Kubernetes apiserver storage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test Kubernetes apiserver storage
        run: make test-apiserver

  test-conformance-quick:
    name: Kubernetes conformance smoke (k0s on T4)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Boots a two-node k0s cluster on T4 and runs Sonobuoy's quick mode;
      # the nightly runs the full suite.
      - name: Run Kubernetes conformance (quick)
        run: make test-conformance
        env:
          T4_CONFORMANCE_MODE: quick

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-quick-results-${{ github.sha }}
          path: .tmp/conformance/
          retention-days: 7
          if-no-files-found: ignore

  test-etcd-diff-linux:
    name: Test differential against etcd (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/etcddiff/go.mod
          cache: true
          cache-dependency-path: tests/etcddiff/go.sum

      # A random seed per run; a failure logs it for ETCDDIFF_SEED=<seed>.
      - name: Test differential against etcd
        run: make test-etcd-diff

  test-robustness-linux:
    name: etcd robustness tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/robustness/go.mod
          cache: true
          cache-dependency-path: tests/robustness/go.sum

      # Single-node scenarios only: three-node ones need T4_ROBUSTNESS_S3.
      - name: Test with etcd's robustness tests
        run: make test-robustness

  s3-cli-smoke:
    name: S3 CLI Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Start S3 server
        run: |
          docker run -d --name t4-s3-smoke \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=t4testadmin \
            -e RUSTFS_SECRET_KEY=t4testadmin \
            rustfs/rustfs:1.0.0

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs t4-s3-smoke
          exit 1

      - name: Run e2e
        run: go test -timeout 360s -count=1 ./tests/e2e
        env:
          T4_E2E_S3: "1"
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: t4testadmin
          S3_SECRET_KEY: t4testadmin
          S3_REGION: us-east-1

      - name: Dump S3 server logs
        if: failure()
        run: docker logs t4-s3-smoke || true

  gcs-smoke:
    name: GCS Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # fake-gcs-server was checked against the preconditions T4's leader lock
      # depends on and enforces all of them; its known gap is conditional
      # deletes, which T4 never issues. The suite's first assertion is
      # object.ProbeConditional against it, so a version that stops enforcing
      # them fails here and says so, rather than letting a split brain through.
      - name: Start GCS emulator
        run: |
          docker run -d --name t4-gcs-smoke \
            -p 4443:4443 \
            fsouza/fake-gcs-server:1.56.1 -scheme http -backend memory

          for i in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4443/storage/v1/b; then
              echo "emulator ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          docker logs t4-gcs-smoke
          exit 1

      - name: Run GCS store tests
        run: go test -timeout 180s -count=1 ./pkg/object
        env:
          T4_GCS_ENDPOINT: http://127.0.0.1:4443

      - name: Run GCS e2e
        run: go test -timeout 360s -count=1 -run GCS ./tests/e2e
        env:
          T4_E2E_GCS: "1"
          GCS_ENDPOINT: http://127.0.0.1:4443

      - name: Dump GCS emulator logs
        if: failure()
        run: docker logs t4-gcs-smoke || true

  upgrade-matrix:
    name: Upgrade Matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}

    steps:
      - uses: actions/checkout@v7

      # The latest patch of the previous minor release, the first patch of the
      # latest minor release, and the latest release.
      - name: Pick releases to upgrade from
        id: matrix
        run: |
          versions=$(hack/upgrade-matrix.sh)
          echo "Upgrading from: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  test-upgrade:
    name: Test Upgrade (from ${{ matrix.from }})
    needs: upgrade-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        from: ${{ fromJSON(needs.upgrade-matrix.outputs.versions) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Start S3 server
        run: |
          docker run -d --name t4-s3-upgrade \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=t4testadmin \
            -e RUSTFS_SECRET_KEY=t4testadmin \
            rustfs/rustfs:1.0.0

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs t4-s3-upgrade
          exit 1

      - name: Download the release to upgrade from
        run: |
          gh release download "$FROM" --pattern t4-linux-amd64 --pattern checksums.txt --dir old
          (cd old && grep ' t4-linux-amd64$' checksums.txt | sha256sum -c -)
          chmod +x old/t4-linux-amd64
        env:
          FROM: ${{ matrix.from }}
          GH_TOKEN: ${{ github.token }}

      - name: Build t4
        run: go build -o t4 ./cmd/t4

      - name: Run upgrade test
        run: go test -timeout 600s -count=1 -v -run TestUpgrade ./tests/upgrade
        env:
          T4_UPGRADE_FROM_BIN: ${{ github.workspace }}/old/t4-linux-amd64
          T4_UPGRADE_TO_BIN: ${{ github.workspace }}/t4
          T4_UPGRADE_S3: "1"
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: t4testadmin
          S3_SECRET_KEY: t4testadmin
          S3_REGION: us-east-1

      - name: Dump S3 server logs
        if: failure()
        run: docker logs t4-s3-upgrade || true

  test-race-linux:
    name: Test Race (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test (race)
        run: go test -race -timeout 360s -count=1 ./...
