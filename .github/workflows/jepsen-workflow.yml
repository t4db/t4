name: Jepsen (reusable)

on:
  workflow_call:
    inputs:
      nemeses:
        description: 'JSON-encoded list of nemeses to run, e.g. ["partition-halves"]. Defaults to the full set.'
        type: string
        required: false
        default: '["partition-halves", "kill", "partition-s3"]'
      workloads:
        description: 'JSON-encoded list of workloads to run, e.g. ["register"]. Defaults to both.'
        type: string
        required: false
        default: '["register", "multi-register"]'
      store:
        description: 'Object store to run against: s3 (RustFS) or gcs (fake-gcs-server).'
        type: string
        required: false
        default: 's3'

jobs:
  jepsen:
    name: "Jepsen (${{ inputs.store }}: ${{ matrix.workload }} / ${{ matrix.nemesis }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        nemesis: ${{ fromJSON(inputs.nemeses) }}
        workload: ${{ fromJSON(inputs.workloads) }}

    steps:
      - uses: actions/checkout@v7

      - name: Generate SSH keys
        run: make -C jepsen keys

      - name: Build images
        run: docker compose -f jepsen/docker-compose.yml build
        env:
          DOCKER_BUILDKIT: "1"

      # Only the store under test is started, so a gcs run does not also
      # bring up RustFS.
      - name: Start infrastructure
        run: |
          docker compose -f jepsen/docker-compose.yml up -d \
            "$STORE" "$STORE-init" n1 n2 n3 n4 n5
          docker compose -f jepsen/docker-compose.yml \
            wait "$STORE-init" || true
        env:
          STORE: ${{ inputs.store }}

      - name: "Run Jepsen (${{ inputs.store }}: ${{ matrix.workload }} / ${{ matrix.nemesis }}, 60 s)"
        run: |
          docker compose -f jepsen/docker-compose.yml run --rm \
            -e T4_JEPSEN_STORE=${{ inputs.store }} control \
            lein run -- test \
              --nodes        n1,n2,n3,n4,n5 \
              --username     root \
              --ssh-private-key /root/.ssh/id_ed25519 \
              --workload     ${{ matrix.workload }} \
              --nemesis      ${{ matrix.nemesis }} \
              --time-limit   60 \
              --concurrency  3

      - name: Upload Jepsen store
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jepsen-store-${{ inputs.store }}-${{ matrix.workload }}-${{ matrix.nemesis }}-${{ github.sha }}
          path: jepsen/store/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose -f jepsen/docker-compose.yml down -v
