name: Jepsen

on:
  push:
    paths:
      - "jepsen/**"
    branches:
      - main
      - "release-*"
  pull_request:
  workflow_dispatch:

jobs:
  jepsen:
    uses: ./.github/workflows/jepsen-workflow.yml
    # PR / branch pushes run a small smoke matrix so iteration on jepsen/**
    # stays fast. The full nemesis and workload matrix runs nightly (see
    # nightly.yml). Of the Elle workloads only append runs here: it covers
    # multi-key Txn serializability, the broadest single check.
    with:
      nemeses: '["partition-halves"]'

  # The same smoke against GCS. A change that breaks one backend should fail on
  # the pull request that made it, not overnight. These run beside the S3 jobs
  # rather than after them, so the wall clock barely moves.
  jepsen-gcs:
    uses: ./.github/workflows/jepsen-workflow.yml
    with:
      store: gcs
      nemeses: '["partition-halves"]'
      workloads: '["register", "multi-register", "append"]'
