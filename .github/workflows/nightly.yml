name: Nightly stress test

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC every night
  workflow_dispatch: # allow manual trigger
  workflow_call: # the release workflow runs these before building (see image-release.yml)

jobs:
  jepsen:
    uses: ./.github/workflows/jepsen-workflow.yml
    # Nightly runs the full nemesis × workload matrix. Per-PR runs use a
    # smaller smoke matrix (see jepsen.yml).
    with:
      nemeses: '["partition-halves", "kill", "partition-s3"]'

  # The same suite against GCS, deliberately narrow.
  #
  # Consensus, replication and fencing reach the object store through t4's
  # object.Store interface, so a linearizability violation would show up on
  # either backend and the full matrix would mostly re-run backend-agnostic
  # checks. What is specific to GCS is how its errors behave when a node
  # cannot reach it, so this runs the nemesis that cuts a node off from the
  # store, against the two workloads that write most.
  jepsen-gcs:
    uses: ./.github/workflows/jepsen-workflow.yml
    with:
      store: gcs
      nemeses: '["partition-s3"]'
      workloads: '["register", "append"]'

  stress:
    name: Stress (30m)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: TestLongRunningConsistency (30m)
        run: |
          go test -run TestLongRunningConsistency -v -timeout 35m -count=1 ./tests/integration
        env:
          TEST_DURATION: 30m

  robustness:
    name: etcd robustness tests (3 nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/robustness/go.mod
          cache: true
          cache-dependency-path: tests/robustness/go.sum

      - name: Start S3 server
        run: |
          docker run -d --name t4-robustness-s3 \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=t4testadmin \
            -e RUSTFS_SECRET_KEY=t4testadmin \
            rustfs/rustfs:1.0.0

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs t4-robustness-s3
          exit 1

      - name: Test with etcd's robustness tests
        run: make test-robustness
        env:
          T4_ROBUSTNESS_S3: "1"

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: robustness-reports-${{ github.sha }}
          path: .tmp/robustness/results/
          retention-days: 30
          if-no-files-found: ignore

  conformance:
    name: Kubernetes conformance (k0s on T4)
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - uses: actions/checkout@v7

      - name: Run Kubernetes conformance with Sonobuoy
        run: make test-conformance

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results-${{ github.sha }}
          path: .tmp/conformance/
          retention-days: 30
          if-no-files-found: ignore
