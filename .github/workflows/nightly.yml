name: Nightly stress test

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every night
  workflow_dispatch: # allow manual trigger
  workflow_call: # the release workflow runs these before building (see image-release.yml)

jobs:
  jepsen:
    uses: ./.github/workflows/jepsen-workflow.yml
    # Nightly runs the full nemesis matrix. Per-PR runs use a smaller smoke
    # matrix (see jepsen.yml).
    with:
      nemeses: '["partition-halves", "kill", "partition-s3"]'

  # The same suite against GCS. Not a reduced one: Jepsen finds bugs by
  # exploring interleavings, and the two stores have different latencies and
  # different failure timing, so they drive the system through different ones.
  # That consensus and fencing reach both through object.Store says the code is
  # shared, not that the same bugs surface. GCS is a supported backend, so it
  # gets the same matrix — anything less invites "it passed on S3".
  jepsen-gcs:
    uses: ./.github/workflows/jepsen-workflow.yml
    with:
      store: gcs
      nemeses: '["partition-halves", "kill", "partition-s3"]'

  stress:
    name: Stress (30m)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: TestLongRunningConsistency (30m)
        run: |
          go test -run TestLongRunningConsistency -v -timeout 35m -count=1 ./tests/integration
        env:
          TEST_DURATION: 30m
